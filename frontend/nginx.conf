server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is one file; everything resolves to it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Same header set the API sends, so the two surfaces agree.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    server_tokens off;
    client_max_body_size 1m;
}

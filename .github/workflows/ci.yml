name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Test
        working-directory: backend
        run: pytest tests/ -q --cov=app --cov-report=term-missing
      - name: Reject a default JWT secret reaching main
        run: |
          ! grep -rn "change-me-in-production" --include="*.env" . || \
            (echo "A default secret is committed" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax-check every script
        working-directory: frontend/standalone
        run: for f in src/*.js assets/*.js build.js; do node --check "$f"; done
      - name: Build the single-file dashboard
        working-directory: frontend/standalone
        run: node build.js
      - name: Fail if any asset was left un-inlined
        run: |
          ! grep -q '<script src=\|<link rel="stylesheet" href=' frontend/dist/aapdasync.html

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t aapdasync-api:ci   ./backend
          docker build -t aapdasync-web:ci   ./frontend
      - name: Containers must not run as root
        run: |
          test "$(docker run --rm aapdasync-api:ci id -u)" != "0"

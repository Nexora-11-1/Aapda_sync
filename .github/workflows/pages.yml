name: Pages

# Publishes two things:
#   /        the project page (site/index.html)
#   /app/    the single-file dashboard, rebuilt from source on every deploy
#
# The dashboard is rebuilt rather than copied from frontend/dist so that what is
# served is provably the output of the committed sources, not a stale artefact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Syntax-check every script
        working-directory: frontend/standalone
        run: for f in src/*.js assets/*.js build.js; do node --check "$f"; done

      - name: Build the single-file dashboard
        working-directory: frontend/standalone
        run: node build.js

      - name: Fail if any asset was left un-inlined
        run: |
          ! grep -q '<script src=\|<link rel="stylesheet" href=' frontend/dist/aapdasync.html

      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site/app
          cp site/index.html            _site/index.html
          cp frontend/dist/aapdasync.html _site/app/index.html
          # Also reachable under its own name, for anyone linking the file directly.
          cp frontend/dist/aapdasync.html _site/app/aapdasync.html
          cp site/index.html            _site/404.html
          touch _site/.nojekyll
          echo "Site contents:"; find _site -type f -printf '%10s  %p\n'

      - name: The published page must carry the standing caveat
        run: |
          grep -q "not an official warning" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
